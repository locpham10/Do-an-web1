<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quản lý Nhập hàng - Admin Portal</title>
        <!-- Nhúng file CSS bên ngoài -->
        <link rel="stylesheet" href="css/imports.css">
    </head>
    <body>
        <asside class = "sidebar">
            <div class = "sidebar-brand">DASHBOARD</div>
            <ul class="sidebar-menu">
                <li><a herf="#">Quản lý khách hàng</a></li>
                <li><a herf="#">Quản lý sản phẩm</a></li>
                <li class="active"><a herf="#">Quản lý nhập hàng</a></li>
                <li><a herf="#">Quản lý giá bán</a></li>
                <li><a herf="#">Quản lý đơn hàng</a></li>
                <li><a herf="#">Báo cáo tồn kho</a></li>
            </ul>
        </asside>

        <!--KHU NỘI DUNG CHÍNH BÊN PHẢI-->

        <div class="main-container">
            <headrer class="Topbar">
                <div class="Topbar-title">Hệ thống quản trị [tên web]</div>
                <div class="Topbar-user">
                    <span>Xin chào, <strong>Admin</strong></span>
                    <button class="btn-logout" onlick="alert('Đã dăng xuất!')">Đăng xuất</button>
                </div>
            </header>

            <!--KHU NỘI DUNG NHẬP HÀNG-->
            <main class="content">
                <div class="page-header">
                    <h1 class="age-title">Danh mục phiếu nhập hàng</h1>
                    <div class="header-actions">
                        <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm theo mã phiếu" onkeyup="searchImport()">
                        <button class="btn-create" onlick="openAddModel()">+ Lập phiếu mới</button>
                    </div>
                </div>

                <!--BẢNG DANH MỤC PHIẾU NHẬP-->
                <div class="card-table">
                    <table id="importTable">
                        <thead>
                            <tr>
                                <th>Mã phiếu</th>
                                <th>Ngày nhập</th>
                                <th>Tổng tiền nhập</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="importTableBody">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>

        <!--MODAL THÊM/SỬA PHIẾU NHẬP-->
        <div id="importModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title" id="modalTitle">Lập phiếu nhập mới</h3>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>

                <div class="form-group">
                    <label>Mã phiếu:</label>
                    <input type="text" id="modalCode" style="background-color: #e9ecef;">
                </div>

                <div class="form-group">
                    <label>Ngày nhập hàng:</label>
                    <input type="date" id="modalDate">
                </div>

                <div class="form-group">
                    <label>Tổng giá trị ước tính (VNĐ):</label>
                    
                </div>
            </div>
        </div>
    </body>
</html>
